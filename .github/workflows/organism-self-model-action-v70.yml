name: organism-self-model-action-v70

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/organism_self_model_action_v70.py"
      - "tests/test_organism_self_model_action_v70.py"
      - "experiments/organism_self_state_readout_v69.py"
      - "src/ontto/**"
      - ".github/workflows/organism-self-model-action-v70.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_self_model_action_v70.py
      - run: python experiments/organism_self_model_action_v70.py --replicates 24 --calibration-cycles 48
      - uses: actions/upload-artifact@v4
        with:
          name: organism-self-model-action-v70
          path: results/organism_self_model_action_v70/
          if-no-files-found: error
