name: interoception-i4-2-materialized

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/interoception-i4-2-materialized.yml'

jobs:
  i4_2:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize pinned sources
        run: |
          set -euo pipefail
          mkdir -p experiments tests
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/952681082204110ac6c22abf2a0355d2ad3506a7 --jq .content | base64 --decode > experiments/interoception_i4_2.py
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/ab04ee4e2d2c1882588d5cb3fb108b81bf997d01 --jq .content | base64 --decode > tests/test_interoception_i4_2.py
          python -m py_compile experiments/interoception_i4_2.py tests/test_interoception_i4_2.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q tests/test_interoception_i4_2.py tests/test_interoceptive_meta_observer.py
      - name: Run I4.2
        run: |
          mkdir -p results/i4_2
          python experiments/interoception_i4_2.py --output results/i4_2/summary.json
      - name: Manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("results/i4_2/run_manifest.json").write_text(
              json.dumps({
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "sha": os.environ.get("GITHUB_SHA"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "workflow": os.environ.get("GITHUB_WORKFLOW")
              }, indent=2),
              encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: interoception-i4-2-materialized
          path: results/i4_2/
          if-no-files-found: error
