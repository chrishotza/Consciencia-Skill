name: i5-4-persistent-selective-access

on:
  push:
    paths:
      - "src/ontto/workspace_selective_access.py"
      - "src/ontto/workspace_query.py"
      - "src/ontto/attention_controller.py"
      - "src/ontto/workspace_controller.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - "experiments/i5_4_persistent_selective_access.py"
      - "tests/test_workspace_selective_access.py"
      - "tests/test_i5_4_persistent_selective_access.py"
      - "docs/I5_4_PERSISTENT_SELECTIVE_ACCESS.md"
      - ".github/workflows/i5-4-persistent-selective-access.yml"
  pull_request:
    paths:
      - "src/ontto/workspace_selective_access.py"
      - "src/ontto/workspace_query.py"
      - "src/ontto/attention_controller.py"
      - "src/ontto/workspace_controller.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - "experiments/i5_4_persistent_selective_access.py"
      - "tests/test_workspace_selective_access.py"
      - "tests/test_i5_4_persistent_selective_access.py"
      - "docs/I5_4_PERSISTENT_SELECTIVE_ACCESS.md"
      - ".github/workflows/i5-4-persistent-selective-access.yml"
  workflow_dispatch:

jobs:
  i5-4:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q tests/test_workspace_selective_access.py tests/test_i5_4_persistent_selective_access.py tests/test_i5_1_workspace_integration.py
      - name: Run I5.4
        run: python experiments/i5_4_persistent_selective_access.py --replicates 24 --warmup 24 --access-weight 0.35 --out results/i5_4_persistent_selective_access
      - name: Manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("results/i5_4_persistent_selective_access/manifest.json").write_text(
              json.dumps(
                  {"repository": os.environ["GITHUB_REPOSITORY"], "sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "workflow": os.environ["GITHUB_WORKFLOW"]},
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i5-4-persistent-selective-access-${{ github.sha }}
          path: results/i5_4_persistent_selective_access/
          if-no-files-found: error
