name: interoception-i4

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/interoception_i4.py'
      - 'src/ontto/interoceptive_meta_observer.py'
      - 'tests/test_interoceptive_meta_observer.py'
      - '.github/workflows/interoception-i4.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q tests/test_interoceptive_meta_observer.py
      - name: Protocol
        run: |
          mkdir -p results/i4
          python experiments/interoception_i4.py --output results/i4/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: interoception-i4
          path: results/i4/
          if-no-files-found: error
