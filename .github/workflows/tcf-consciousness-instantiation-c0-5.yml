name: tcf-consciousness-instantiation-c0-5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_tcf_consciousness_instantiation_c0_5.py
      - run: >
          python experiments/tcf_consciousness_instantiation_c0_5.py
          --episodes 64
          --train-episodes 64
          --observer-samples 512
      - uses: actions/upload-artifact@v4
        with:
          name: tcf-consciousness-instantiation-c0-5
          path: results/tcf_consciousness_instantiation_c0_5/
          if-no-files-found: error
