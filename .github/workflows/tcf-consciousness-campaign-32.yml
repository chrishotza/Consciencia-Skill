name: tcf-consciousness-campaign-32

on:
  schedule:
    - cron: '30 23 1 10 *'
    - cron: '30 0 2 10 *'
    - cron: '30 1 2 10 *'
    - cron: '30 2 2 10 *'
    - cron: '30 3 2 10 *'
    - cron: '30 4 2 10 *'
    - cron: '30 5 2 10 *'
    - cron: '30 6 2 10 *'
  workflow_dispatch:
    inputs:
      group:
        description: "Campaign group to run (4 replicas)"
        required: true
        type: choice
        options: [G1, G2, G3, G4, G5, G6, G7, G8]
        default: G1

jobs:
  campaign:
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: pip install pytest

      - name: Validate campaign runner
        run: pytest -q tests/test_tcf_consciousness_campaign.py

      - name: Resolve campaign group
        shell: bash
        run: |
          SCHEDULE='${{ github.event.schedule }}'
          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              '30 23 1 10 *') GROUP=G1 ;;
              '30 0 2 10 *') GROUP=G2 ;;
              '30 1 2 10 *') GROUP=G3 ;;
              '30 2 2 10 *') GROUP=G4 ;;
              '30 3 2 10 *') GROUP=G5 ;;
              '30 4 2 10 *') GROUP=G6 ;;
              '30 5 2 10 *') GROUP=G7 ;;
              '30 6 2 10 *') GROUP=G8 ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          else
            GROUP='${{ inputs.group }}'
          fi

          case "$GROUP" in
            G1) GROUP_INDEX=1 ;;
            G2) GROUP_INDEX=2 ;;
            G3) GROUP_INDEX=3 ;;
            G4) GROUP_INDEX=4 ;;
            G5) GROUP_INDEX=5 ;;
            G6) GROUP_INDEX=6 ;;
            G7) GROUP_INDEX=7 ;;
            G8) GROUP_INDEX=8 ;;
            *) echo "Unknown group: $GROUP" >&2; exit 1 ;;
          esac

          SEED_BASE=$((100000 + GROUP_INDEX * 1000 + ${{ matrix.replicate }} * 100))

          echo "GROUP=$GROUP" >> "$GITHUB_ENV"
          echo "REPLICATE=${{ matrix.replicate }}" >> "$GITHUB_ENV"
          echo "SEED_BASE=$SEED_BASE" >> "$GITHUB_ENV"

          cat > campaign_slot_env.json <<EOF
          {
            "group": "$GROUP",
            "replicate": ${{ matrix.replicate }},
            "seed_base": $SEED_BASE,
            "scheduled_cron": "$SCHEDULE"
          }
          EOF

      - name: Run campaign slot
        run: >
          python experiments/tcf_consciousness_campaign.py
          --group "$GROUP"
          --replicate "$REPLICATE"
          --episodes 64
          --train-episodes 64
          --observer-samples 512
          --out results/tcf_campaign

      - name: Validate and attach slot metadata
        shell: bash
        run: |
          SLOT_DIR="results/tcf_campaign/$GROUP"_R"$REPLICATE"
          test -f "$SLOT_DIR/summary.json"
          test -f "$SLOT_DIR/policy_snapshot.json"
          cp campaign_slot_env.json "$SLOT_DIR/scheduled_slot.json"

      - name: Upload campaign artifact
        uses: actions/upload-artifact@v4
        with:
          name: c0-campaign-${{ env.GROUP }}-R${{ env.REPLICATE }}
          path: results/tcf_campaign/${{ env.GROUP }}_R${{ env.REPLICATE }}
          if-no-files-found: error
          compression-level: 6
