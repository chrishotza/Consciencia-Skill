name: tcf-consciousness-campaign-32

on:
  schedule:
    - cron: '15 22 1 10 *'
    - cron: '30 22 1 10 *'
    - cron: '45 22 1 10 *'
    - cron: '0 23 1 10 *'
    - cron: '15 23 1 10 *'
    - cron: '30 23 1 10 *'
    - cron: '45 23 1 10 *'
    - cron: '0 0 2 10 *'
    - cron: '15 0 2 10 *'
    - cron: '30 0 2 10 *'
    - cron: '45 0 2 10 *'
    - cron: '0 1 2 10 *'
    - cron: '15 1 2 10 *'
    - cron: '30 1 2 10 *'
    - cron: '45 1 2 10 *'
    - cron: '0 2 2 10 *'
    - cron: '15 2 2 10 *'
    - cron: '30 2 2 10 *'
    - cron: '45 2 2 10 *'
    - cron: '0 3 2 10 *'
    - cron: '15 3 2 10 *'
    - cron: '30 3 2 10 *'
    - cron: '45 3 2 10 *'
    - cron: '0 4 2 10 *'
    - cron: '15 4 2 10 *'
    - cron: '30 4 2 10 *'
    - cron: '45 4 2 10 *'
    - cron: '0 5 2 10 *'
    - cron: '15 5 2 10 *'
    - cron: '30 5 2 10 *'
    - cron: '45 5 2 10 *'
    - cron: '0 6 2 10 *'
  workflow_dispatch:
    inputs:
      group:
        description: "Campaign group to run manually"
        required: true
        type: choice
        options: [G1, G2, G3, G4, G5, G6, G7, G8]
        default: G1
      replicate:
        description: "Replica to run manually"
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: pip install pytest

      - name: Validate campaign runner
        run: pytest -q tests/test_tcf_consciousness_campaign.py

      - name: Resolve campaign slot
        shell: bash
        run: |
          SCHEDULE='${{ github.event.schedule }}'
          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              '15 22 1 10 *') GROUP=G1; REPLICATE=1 ;;
              '30 22 1 10 *') GROUP=G1; REPLICATE=2 ;;
              '45 22 1 10 *') GROUP=G1; REPLICATE=3 ;;
              '0 23 1 10 *') GROUP=G1; REPLICATE=4 ;;
              '15 23 1 10 *') GROUP=G2; REPLICATE=1 ;;
              '30 23 1 10 *') GROUP=G2; REPLICATE=2 ;;
              '45 23 1 10 *') GROUP=G2; REPLICATE=3 ;;
              '0 0 2 10 *') GROUP=G2; REPLICATE=4 ;;
              '15 0 2 10 *') GROUP=G3; REPLICATE=1 ;;
              '30 0 2 10 *') GROUP=G3; REPLICATE=2 ;;
              '45 0 2 10 *') GROUP=G3; REPLICATE=3 ;;
              '0 1 2 10 *') GROUP=G3; REPLICATE=4 ;;
              '15 1 2 10 *') GROUP=G4; REPLICATE=1 ;;
              '30 1 2 10 *') GROUP=G4; REPLICATE=2 ;;
              '45 1 2 10 *') GROUP=G4; REPLICATE=3 ;;
              '0 2 2 10 *') GROUP=G4; REPLICATE=4 ;;
              '15 2 2 10 *') GROUP=G5; REPLICATE=1 ;;
              '30 2 2 10 *') GROUP=G5; REPLICATE=2 ;;
              '45 2 2 10 *') GROUP=G5; REPLICATE=3 ;;
              '0 3 2 10 *') GROUP=G5; REPLICATE=4 ;;
              '15 3 2 10 *') GROUP=G6; REPLICATE=1 ;;
              '30 3 2 10 *') GROUP=G6; REPLICATE=2 ;;
              '45 3 2 10 *') GROUP=G6; REPLICATE=3 ;;
              '0 4 2 10 *') GROUP=G6; REPLICATE=4 ;;
              '15 4 2 10 *') GROUP=G7; REPLICATE=1 ;;
              '30 4 2 10 *') GROUP=G7; REPLICATE=2 ;;
              '45 4 2 10 *') GROUP=G7; REPLICATE=3 ;;
              '0 5 2 10 *') GROUP=G7; REPLICATE=4 ;;
              '15 5 2 10 *') GROUP=G8; REPLICATE=1 ;;
              '30 5 2 10 *') GROUP=G8; REPLICATE=2 ;;
              '45 5 2 10 *') GROUP=G8; REPLICATE=3 ;;
              '0 6 2 10 *') GROUP=G8; REPLICATE=4 ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          else
            GROUP='${{ inputs.group }}'
            REPLICATE='${{ inputs.replicate }}'
          fi

          case "$GROUP" in
            G1) GROUP_INDEX=1 ;;
            G2) GROUP_INDEX=2 ;;
            G3) GROUP_INDEX=3 ;;
            G4) GROUP_INDEX=4 ;;
            G5) GROUP_INDEX=5 ;;
            G6) GROUP_INDEX=6 ;;
            G7) GROUP_INDEX=7 ;;
            G8) GROUP_INDEX=8 ;;
            *) echo "Unknown group: $GROUP" >&2; exit 1 ;;
          esac

          SEED_BASE=$((100000 + GROUP_INDEX * 1000 + REPLICATE * 100))

          echo "GROUP=$GROUP" >> "$GITHUB_ENV"
          echo "REPLICATE=$REPLICATE" >> "$GITHUB_ENV"
          echo "SEED_BASE=$SEED_BASE" >> "$GITHUB_ENV"

          cat > campaign_slot_env.json <<EOF
          {
            "group": "$GROUP",
            "replicate": $REPLICATE,
            "seed_base": $SEED_BASE,
            "scheduled_cron": "$SCHEDULE"
          }
          EOF

      - name: Run campaign slot
        run: >
          python experiments/tcf_consciousness_campaign.py
          --group "$GROUP"
          --replicate "$REPLICATE"
          --episodes 64
          --train-episodes 64
          --observer-samples 512
          --out results/tcf_campaign

      - name: Attach slot metadata
        shell: bash
        run: |
          SLOT_DIR="results/tcf_campaign/$GROUP"_R"$REPLICATE"
          test -f "$SLOT_DIR/summary.json"
          test -f "$SLOT_DIR/policy_snapshot.json"
          cp campaign_slot_env.json "$SLOT_DIR/scheduled_slot.json"

      - name: Upload campaign artifact
        uses: actions/upload-artifact@v4
        with:
          name: c0-campaign-${{ env.GROUP }}-R${{ env.REPLICATE }}
          path: results/tcf_campaign
          if-no-files-found: error
          compression-level: 6
