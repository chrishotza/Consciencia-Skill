name: metacognitive-plasticity

on:
  push:
    branches:
      - feat/metacognitive-plasticity-v1
    paths:
      - "src/skill_conscious/core.py"
      - "tests/test_metacognitive_plasticity.py"
      - "experiments/metacognitive_plasticity_longitudinal.py"
      - "docs/METACOGNITIVE_PLASTICITY.md"
      - ".github/workflows/metacognitive-plasticity.yml"
  pull_request:
    paths:
      - "src/skill_conscious/core.py"
      - "tests/test_metacognitive_plasticity.py"
      - "experiments/metacognitive_plasticity_longitudinal.py"
      - "docs/METACOGNITIVE_PLASTICITY.md"
      - ".github/workflows/metacognitive-plasticity.yml"

concurrency:
  group: metacognitive-plasticity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: timeout 120s python -m pytest -vv -x tests/test_metacognitive_plasticity.py
      - run: timeout 120s python experiments/metacognitive_plasticity_longitudinal.py
