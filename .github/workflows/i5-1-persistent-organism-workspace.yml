name: i5-1-persistent-organism-workspace

on:
  push:
    paths:
      - "src/ontto/workspace_controller.py"
      - "src/ontto/global_workspace.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - "experiments/i5_1_persistent_organism_workspace.py"
      - "tests/test_i5_1_workspace_integration.py"
      - "tests/test_workspace_controller.py"
      - "docs/I5_1_PERSISTENT_ORGANISM_WORKSPACE.md"
      - ".github/workflows/i5-1-persistent-organism-workspace.yml"
  pull_request:
    paths:
      - "src/ontto/workspace_controller.py"
      - "src/ontto/global_workspace.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - "experiments/i5_1_persistent_organism_workspace.py"
      - "tests/test_i5_1_workspace_integration.py"
      - "tests/test_workspace_controller.py"
      - "docs/I5_1_PERSISTENT_ORGANISM_WORKSPACE.md"
      - ".github/workflows/i5-1-persistent-organism-workspace.yml"
  workflow_dispatch:

jobs:
  i5-1:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q tests/test_workspace_controller.py tests/test_i5_1_workspace_integration.py
      - name: Run I5.1
        run: python experiments/i5_1_persistent_organism_workspace.py --replicates 24 --warmup 24 --out results/i5_1_persistent_organism_workspace
      - name: Manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("results/i5_1_persistent_organism_workspace/manifest.json").write_text(
              json.dumps({"repository": os.environ["GITHUB_REPOSITORY"], "sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "workflow": os.environ["GITHUB_WORKFLOW"]}, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i5-1-persistent-organism-workspace-${{ github.sha }}
          path: results/i5_1_persistent_organism_workspace/
          if-no-files-found: error