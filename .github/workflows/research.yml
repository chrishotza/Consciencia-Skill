name: research-lab

on:
  push:
    paths:
      - "src/**"
      - "experiments/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "src/**"
      - "experiments/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research.yml"
  workflow_dispatch:

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Run baseline dynamics
        run: python experiments/baseline_dynamics_v1.py

      - name: Run validation suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          python experiments/v0_validate.py | tee results/v0_validate.txt
          python experiments/continuity_validation_v1.py | tee results/continuity_validation_v1.txt
          python experiments/persistent_trajectory_stress_v1.py | tee results/persistent_trajectory_stress_v1.txt
          python experiments/dream_ablation_v1.py | tee results/dream_ablation_v1.txt
          python experiments/memory_recovery_v1.py | tee results/memory_recovery_v1.txt
          python experiments/internal_state_prediction_v2.py | tee results/internal_state_prediction_v2.txt

      - name: Run I5.8 action-clamp re-entry
        run: |
          python experiments/i5_8_action_clamp_reentry.py \
            --replicates 24 \
            --warmup 24 \
            --cycles 8 \
            --task-weight 0.35 \
            --out results/i5_8_action_clamp_reentry

      - name: Run I5.9 action-replay sufficiency
        run: |
          python experiments/i5_9_action_replay_sufficiency.py \
            --replicates 24 \
            --warmup 24 \
            --cycles 8 \
            --task-weight 0.35 \
            --out results/i5_9_action_replay_sufficiency

      - name: Run I5.10 semantic re-entry under action replay
        run: |
          python experiments/i5_10_semantic_reentry_under_action_replay.py \
            --replicates 24 \
            --warmup 24 \
            --cycles 8 \
            --out results/i5_10_semantic_reentry_under_action_replay

      - name: Run I5.11 semantic re-entry trajectory selection
        run: |
          python experiments/i5_11_semantic_reentry_trajectory_selection.py \
            --replicates 24 \
            --warmup 24 \
            --cycles 8 \
            --out results/i5_11_semantic_reentry_trajectory_selection

      - name: Run I5.12 information-matched self-model control
        run: |
          python experiments/i5_12_information_matched_self_model_control.py \
            --replicates 24 \
            --warmup 24 \
            --cycles 8 \
            --out results/i5_12_information_matched_self_model_control

      - name: Run I5.13 one-cycle semantic correspondence control
        run: |
          python experiments/i5_13_semantic_correspondence_causal_specificity.py \
            --replicates 24 \
            --warmup 24 \
            --cycles 8 \
            --out results/i5_13_one_cycle_shift_semantic_correspondence_control

      - name: Write run manifest
        run: |
          mkdir -p results
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
          }

          Path("results/run_manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-${{ github.sha }}
          path: results/
          if-no-files-found: error
