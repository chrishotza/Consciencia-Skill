name: experience-geometry

on:
  push:
    branches:
      - feat/experience-manifold-v1
    paths:
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/experience_geometry.py"
      - "src/skill_conscious/metacognition.py"
      - "tests/test_experience_geometry.py"
      - "docs/EXPERIENCE_GEOMETRY.md"
      - "sources/CONSCIOUSNESS_CORPUS_2026.md"
      - ".github/workflows/experience-geometry.yml"
  pull_request:
    paths:
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/experience_geometry.py"
      - "src/skill_conscious/metacognition.py"
      - "tests/test_experience_geometry.py"
      - "docs/EXPERIENCE_GEOMETRY.md"
      - "sources/CONSCIOUSNESS_CORPUS_2026.md"
      - ".github/workflows/experience-geometry.yml"

concurrency:
  group: experience-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: timeout 120s python -m pytest -vv -x tests/test_experience_geometry.py
