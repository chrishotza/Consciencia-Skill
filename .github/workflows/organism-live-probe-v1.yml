name: organism-live-probe-v1

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of WAKE cycles"
        required: false
        default: "40"
        type: string
      dream_every:
        description: "Dream every N WAKE cycles"
        required: false
        default: "10"
        type: string

jobs:
  live-probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ONTTO_API_KEY: ${{ secrets.ONTTO_API_KEY }}
      ONTTO_API_BASE_URL: ${{ secrets.ONTTO_API_BASE_URL }}
      ONTTO_MODEL: ${{ secrets.ONTTO_MODEL }}
      ONTTO_AGENT_ID: live-longitudinal-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate secrets
        shell: bash
        run: |
          test -n "$ONTTO_API_KEY" || { echo "Missing ONTTO_API_KEY"; exit 1; }
          test -n "$ONTTO_MODEL" || { echo "Missing ONTTO_MODEL"; exit 1; }
      - name: Run live longitudinal probe
        run: |
          mkdir -p results
          python experiments/longitudinal_organism_v1.py \
            --mode live \
            --cycles "${{ inputs.cycles }}" \
            --dream-every "${{ inputs.dream_every }}" \
            --sleep-seconds 0
      - uses: actions/upload-artifact@v4
        with:
          name: organism-live-probe-v1-${{ github.sha }}
          path: |
            results/longitudinal_organism_v1.db
            results/longitudinal_organism_v1/
          if-no-files-found: error