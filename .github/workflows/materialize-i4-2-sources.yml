name: materialize-i4-2-sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-i4-2-sources.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Materialize I4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments tests
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/952681082204110ac6c22abf2a0355d2ad3506a7 --jq .content | base64 --decode > experiments/interoception_i4_2.py
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/ab04ee4e2d2c1882588d5cb3fb108b81bf997d01 --jq .content | base64 --decode > tests/test_interoception_i4_2.py
          python -m py_compile experiments/interoception_i4_2.py tests/test_interoception_i4_2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/interoception_i4_2.py tests/test_interoception_i4_2.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: materialize I4.2 sources"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
