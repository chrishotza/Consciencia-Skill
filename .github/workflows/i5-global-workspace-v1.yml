name: i5-global-workspace-v1

on:
  push:
    paths:
      - "src/ontto/global_workspace.py"
      - "experiments/i5_global_workspace_v1.py"
      - "tests/test_global_workspace.py"
      - "docs/I5_GLOBAL_WORKSPACE.md"
      - ".github/workflows/i5-global-workspace-v1.yml"
  pull_request:
    paths:
      - "src/ontto/global_workspace.py"
      - "experiments/i5_global_workspace_v1.py"
      - "tests/test_global_workspace.py"
      - "docs/I5_GLOBAL_WORKSPACE.md"
      - ".github/workflows/i5-global-workspace-v1.yml"
  workflow_dispatch:

jobs:
  i5-global-workspace:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q tests/test_global_workspace.py
      - name: Run I5
        run: python experiments/i5_global_workspace_v1.py --out results/i5_global_workspace_v1
      - name: Manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('results/i5_global_workspace_v1/manifest.json').write_text(json.dumps({'repository':os.environ['GITHUB_REPOSITORY'],'sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'workflow':os.environ['GITHUB_WORKFLOW']},indent=2),encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i5-global-workspace-v1-${{ github.sha }}
          path: results/i5_global_workspace_v1/
          if-no-files-found: error