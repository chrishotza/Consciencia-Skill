name: metacognitive-uncertainty

on:
  push:
    branches:
      - feat/metacognitive-uncertainty-v1
    paths:
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/metacognition.py"
      - "src/skill_conscious/llm_adapter.py"
      - "tests/test_metacognitive_uncertainty.py"
      - "experiments/metacognitive_uncertainty_longitudinal.py"
      - "docs/METACOGNITIVE_UNCERTAINTY.md"
      - ".github/workflows/metacognitive-uncertainty.yml"
  pull_request:
    paths:
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/metacognition.py"
      - "src/skill_conscious/llm_adapter.py"
      - "tests/test_metacognitive_uncertainty.py"
      - "experiments/metacognitive_uncertainty_longitudinal.py"
      - "docs/METACOGNITIVE_UNCERTAINTY.md"
      - ".github/workflows/metacognitive-uncertainty.yml"

concurrency:
  group: metacognitive-uncertainty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: timeout 120s python -m pytest -vv -x tests/test_metacognitive_uncertainty.py
      - run: timeout 120s python experiments/metacognitive_uncertainty_longitudinal.py
