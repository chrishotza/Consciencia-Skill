name: interoception-i3

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/ontto/interoception.py'
      - 'src/ontto/interoception_controller.py'
      - 'src/ontto/bridge.py'
      - 'experiments/interoception_i3.py'
      - 'tests/test_interoception_i3.py'
      - '.github/workflows/interoception-i3.yml'

concurrency:
  group: interoception-i3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i3:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run I3 harness tests
        run: pytest -q tests/test_interoception_unit.py tests/test_interoception_i1.py tests/test_interoception_i2.py tests/test_interoception_i3.py tests/test_interoceptive_runtime_hook.py
      - name: Run I3 protocol
        run: |
          mkdir -p results/i3
          python experiments/interoception_i3.py --output results/i3/summary.json
      - name: Write run manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'workflow': os.environ.get('GITHUB_WORKFLOW'),
          }
          Path('results/i3/run_manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
      - name: Upload I3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: interoception-i3-${{ github.sha }}
          path: results/i3/
          if-no-files-found: error
