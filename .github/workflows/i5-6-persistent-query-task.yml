name: i5-6-persistent-query-task

on:
  push:
    paths:
      - "src/ontto/workspace_query_task.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - "src/ontto/attention_controller.py"
      - "src/ontto/workspace_query.py"
      - "experiments/i5_6_persistent_query_task.py"
      - "tests/test_workspace_query_task.py"
      - "tests/test_i5_6_persistent_query_task.py"
      - "docs/I5_6_PERSISTENT_QUERY_TASK.md"
      - ".github/workflows/i5-6-persistent-query-task.yml"
  pull_request:
    paths:
      - "src/ontto/workspace_query_task.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - "src/ontto/attention_controller.py"
      - "src/ontto/workspace_query.py"
      - "experiments/i5_6_persistent_query_task.py"
      - "tests/test_workspace_query_task.py"
      - "tests/test_i5_6_persistent_query_task.py"
      - "docs/I5_6_PERSISTENT_QUERY_TASK.md"
      - ".github/workflows/i5-6-persistent-query-task.yml"
  workflow_dispatch:

jobs:
  i5-6:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q tests/test_workspace_query_task.py tests/test_i5_6_persistent_query_task.py
      - name: Run I5.6
        run: python experiments/i5_6_persistent_query_task.py --replicates 24 --warmup 24 --task-weight 0.35 --out results/i5_6_persistent_query_task
      - name: Manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("results/i5_6_persistent_query_task/manifest.json").write_text(
              json.dumps(
                  {
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "workflow": os.environ["GITHUB_WORKFLOW"],
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i5-6-persistent-query-task-${{ github.sha }}
          path: results/i5_6_persistent_query_task/
          if-no-files-found: error
