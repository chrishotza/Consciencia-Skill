name: i5-5-causal-query-bottleneck

on:
  push:
    paths:
      - "src/ontto/causal_query_bottleneck.py"
      - "src/ontto/workspace_query.py"
      - "src/ontto/attention_controller.py"
      - "experiments/i5_5_causal_query_bottleneck.py"
      - "tests/test_causal_query_bottleneck.py"
      - "tests/test_i5_5_causal_query_bottleneck.py"
      - "docs/I5_5_CAUSAL_QUERY_BOTTLENECK.md"
      - ".github/workflows/i5-5-causal-query-bottleneck.yml"
  pull_request:
    paths:
      - "src/ontto/causal_query_bottleneck.py"
      - "src/ontto/workspace_query.py"
      - "src/ontto/attention_controller.py"
      - "experiments/i5_5_causal_query_bottleneck.py"
      - "tests/test_causal_query_bottleneck.py"
      - "tests/test_i5_5_causal_query_bottleneck.py"
      - "docs/I5_5_CAUSAL_QUERY_BOTTLENECK.md"
      - ".github/workflows/i5-5-causal-query-bottleneck.yml"
  workflow_dispatch:

jobs:
  i5-5:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q tests/test_causal_query_bottleneck.py tests/test_i5_5_causal_query_bottleneck.py
      - name: Run I5.5
        run: python experiments/i5_5_causal_query_bottleneck.py --episodes 512 --threshold 0.20 --out results/i5_5_causal_query_bottleneck
      - name: Manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("results/i5_5_causal_query_bottleneck/manifest.json").write_text(
              json.dumps(
                  {
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "workflow": os.environ["GITHUB_WORKFLOW"],
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i5-5-causal-query-bottleneck-${{ github.sha }}
          path: results/i5_5_causal_query_bottleneck/
          if-no-files-found: error
