name: interoception-i4-1-materialized-v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/interoception-i4-1-materialized-v2.yml'

jobs:
  i4_1:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize pinned sources
        run: |
          set -euo pipefail
          mkdir -p experiments tests
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/00cd45eb5016dc9f894533116c7fb8a2122baaec --jq .content | base64 --decode > experiments/interoception_i4_1.py
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/de32844c7a4ffd7bd4cb40e16d8749363772a50e --jq .content | base64 --decode > tests/test_interoception_i4_1.py
          python -m py_compile experiments/interoception_i4_1.py tests/test_interoception_i4_1.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Tests
        run: pytest -q tests/test_interoception_i4_1.py tests/test_interoceptive_meta_observer.py
      - name: Run I4.1
        run: |
          mkdir -p results/i4_1
          python experiments/interoception_i4_1.py --output results/i4_1/summary.json
      - name: Manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("results/i4_1/run_manifest.json").write_text(json.dumps({
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW")
          }, indent=2), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: interoception-i4-1-materialized-v2
          path: results/i4_1/
          if-no-files-found: error
