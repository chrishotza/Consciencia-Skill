name: interoception-i4-materialized

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/interoception-i4-materialized.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize harness
        run: |
          mkdir -p src/ontto experiments tests
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/660614e86b7fc296d9bcfa2b1ea7f2ebd22113c5 --jq .content | base64 --decode > src/ontto/interoceptive_meta_observer.py
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/a6981faa73e48574d52dc2f0f544167775b3e3fd --jq .content | base64 --decode > experiments/interoception_i4.py
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/b251404620f715b80ad8be296930476dbd0d8093 --jq .content | base64 --decode > tests/test_interoceptive_meta_observer.py
          python -m py_compile src/ontto/interoceptive_meta_observer.py experiments/interoception_i4.py tests/test_interoceptive_meta_observer.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test
        run: pytest -q tests/test_interoceptive_meta_observer.py
      - name: Run I4
        run: |
          mkdir -p results/i4
          python experiments/interoception_i4.py --output results/i4/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: interoception-i4-materialized
          path: results/i4/
          if-no-files-found: error
