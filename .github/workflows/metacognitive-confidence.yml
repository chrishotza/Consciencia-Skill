name: metacognitive-confidence

on:
  push:
    paths:
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/metacognition.py"
      - "src/skill_conscious/metacognitive_confidence_probe.py"
      - "tests/test_metacognitive_confidence.py"
      - "experiments/metacognitive_confidence_probe.py"
      - ".github/workflows/metacognitive-confidence.yml"
  pull_request:
    paths:
      - "src/skill_conscious/core.py"
      - "src/skill_conscious/metacognition.py"
      - "src/skill_conscious/metacognitive_confidence_probe.py"
      - "tests/test_metacognitive_confidence.py"
      - "experiments/metacognitive_confidence_probe.py"
      - ".github/workflows/metacognitive-confidence.yml"

concurrency:
  group: metacognitive-confidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: timeout 120s python -m pytest -vv -x tests/test_metacognitive_confidence.py
      - run: timeout 120s python -m experiments.metacognitive_confidence_probe
