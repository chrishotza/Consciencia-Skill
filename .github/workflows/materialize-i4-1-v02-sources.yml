name: materialize-i4-1-v02-sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-i4-1-v02-sources.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Materialize I4.1 v0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments tests
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/b6868ea5186d868269168a26bb8b3890a205c5cd --jq .content | base64 --decode > experiments/interoception_i4_1.py
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/de32844c7a4ffd7bd4cb40e16d8749363772a50e --jq .content | base64 --decode > tests/test_interoception_i4_1.py
          python -m py_compile experiments/interoception_i4_1.py tests/test_interoception_i4_1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/interoception_i4_1.py tests/test_interoception_i4_1.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: materialize I4.1 v0.2 sources"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
