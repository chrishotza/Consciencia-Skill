name: adversarial-battery

on:
  pull_request:
    paths:
      - "src/skill_conscious/adversarial_battery.py"
      - "tests/test_adversarial_battery.py"
      - "experiments/theory_adversarial_battery.py"
  push:
    branches:
      - main

jobs:
  adversarial-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run adversarial battery tests
        run: python -m pytest -q tests/test_adversarial_battery.py
