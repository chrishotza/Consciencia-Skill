name: Hume Adversarial Probe
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hume-bundle-ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run deterministic self-development probe
        run: python experiments/self_development_target_adaptation.py
      - name: Run deterministic self-development A/B/C/D ablation
        run: python experiments/self_development_ablation.py
      - name: Run deterministic Hume probe
        run: python experiments/hume_bundle_ab.py
