name: DeepSeek Architecture Review

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deepseek-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DeepSeek secret and API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get("DEEPSEEK_API_KEY", "")
          if not key:
              raise SystemExit("DEEPSEEK_API_KEY is unavailable to this workflow.")

          body = json.dumps({
              "model": "deepseek-chat",
              "messages": [
                  {"role": "user", "content": "Reply with exactly: DEEPSEEK_OK"}
              ],
              "temperature": 0
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=body,
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))

          answer = payload["choices"][0]["message"]["content"].strip()
          print(f"DeepSeek API responded: {answer}")
          if answer != "DEEPSEEK_OK":
              raise SystemExit("DeepSeek API returned an unexpected response.")
          PY
