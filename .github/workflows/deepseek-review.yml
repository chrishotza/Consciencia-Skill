name: DeepSeek Architecture Review

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deepseek-microprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run low-token consciousness microprobe
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m pip install -e .
          python experiments/deepseek_microprobe.py
