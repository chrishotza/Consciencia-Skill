name: tcf-consciousness-instantiation-c0-16

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN-C0.16]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_tcf_consciousness_instantiation_c0_16.py
      - run: >
          python experiments/tcf_consciousness_instantiation_c0_16.py
          --episodes 24
          --out results/tcf_consciousness_instantiation_c0_16
      - name: Validate outputs
        shell: bash
        run: |
          test -f results/tcf_consciousness_instantiation_c0_16/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: tcf-consciousness-instantiation-c0-16
          path: results/tcf_consciousness_instantiation_c0_16/
          if-no-files-found: error
          compression-level: 6
