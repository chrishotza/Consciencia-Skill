name: organism-memory-swap-v48

on:
  push:
    paths:
      - "experiments/organism_memory_swap_v48.py"
      - "tests/test_organism_memory_swap_v48.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - ".github/workflows/organism-memory-swap-v48.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_memory_swap_v48.py
      - run: python experiments/organism_memory_swap_v48.py --mode fake
      - uses: actions/upload-artifact@v4
        with:
          name: organism-memory-swap-v48
          path: results/organism_memory_swap_v48/
          if-no-files-found: error
